<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembaran Kerja Bawah Laut</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Gaya khusus untuk cetakan A4 */
        @page {
            size: A4;
            margin: 0;
        }
        
        body {
            background-color: #f1f5f9; /* bg-slate-100 */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        .print-page {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background-color: white;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media print {
            body {
                background-color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .print-page {
                margin: 0;
                padding: 0;
                page-break-after: always;
                box-shadow: none !important;
                border: none !important;
            }
            #worksheet-container {
                margin: 0 !important;
                padding: 0 !important;
                gap: 0 !important;
            }
        }
        
        /* Font khusus jika diperlukan */
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
</head>
<body>

    <!-- Panel Kawalan (Tidak akan dicetak) -->
    <div class="no-print sticky top-0 z-50 flex items-center justify-between bg-white px-6 py-4 shadow-md border-b-4 border-cyan-500">
        <div>
            <h1 class="text-2xl font-bold text-cyan-700">🐠 Penjana Lembaran Kerja</h1>
            <p class="text-sm text-slate-500">Jumlah: 40 Muka Surat (15 Aras Rendah, 25 Aras Tinggi)</p>
        </div>
        <div class="flex space-x-4">
            <button onclick="generateWorksheets()" class="flex items-center rounded-xl bg-amber-400 px-4 py-2 font-bold text-amber-950 shadow-sm hover:bg-amber-300 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
                Jana Soalan Baharu
            </button>
            <button onclick="window.print()" class="flex items-center rounded-xl bg-cyan-600 px-6 py-2 font-bold text-white shadow-sm hover:bg-cyan-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
                Cetak (PDF)
            </button>
        </div>
    </div>

    <!-- Container Utama untuk Muka Surat -->
    <div id="worksheet-container" class="flex flex-col items-center py-8 space-y-8 bg-slate-100 w-full">
        <!-- Muka surat akan dijana oleh JavaScript di sini -->
        <div id="loading" class="text-2xl font-bold text-cyan-600 my-20">Menjana 40 Muka Surat... 🐢🐡🐠</div>
    </div>

    <script>
        const SEA_ICONS = ['🐠', '🦀', '🐙', '🐢', '🐳', '🐬', '🐡', '🦑', '🐚'];

        // Fungsi untuk mendapatkan nombor rawak
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Fungsi untuk mendapatkan ikon rawak
        function getRandomIcon() {
            return SEA_ICONS[getRandomInt(0, SEA_ICONS.length - 1)];
        }

        // Fungsi utama untuk menjana lembaran kerja
        function generateWorksheets() {
            const container = document.getElementById('worksheet-container');
            container.innerHTML = ''; // Kosongkan container

            let htmlContent = '';

            // ==========================================
            // JANA 15 MUKA SURAT ARAS RENDAH (Bawah 20)
            // ==========================================
            for (let p = 0; p < 15; p++) {
                let pageNum = p + 1;
                
                // Header Aras Rendah
                let pageHtml = `
                <div class="print-page shadow-2xl p-4">
                    <!-- Hiasan Sempadan -->
                    <div class="absolute inset-4 border-[6px] border-dashed border-cyan-300 rounded-[2rem] pointer-events-none"></div>
                    
                    <!-- Hiasan Penjuru -->
                    <div class="absolute top-6 left-6 text-4xl">🦀</div>
                    <div class="absolute top-6 right-8 text-4xl">🐠</div>
                    <div class="absolute bottom-6 left-8 text-4xl">🐚</div>
                    <div class="absolute bottom-6 right-6 text-4xl">🐳</div>

                    <div class="w-full px-12 pt-8 pb-4 flex-1 flex flex-col z-10 box-border h-full">
                        <!-- Bahagian Header -->
                        <div class="flex justify-between items-end mb-4 font-bold text-lg text-cyan-900 border-b-2 border-cyan-100 pb-2">
                            <div class="flex items-center">
                                NAMA: <div class="ml-2 w-48 border-b-2 border-cyan-800"></div>
                            </div>
                            <div class="flex items-center">
                                TARIKH: <div class="ml-2 w-32 border-b-2 border-cyan-800"></div>
                            </div>
                            <div class="text-xl">${pageNum}</div>
                        </div>

                        <h2 class="text-3xl font-black text-center text-cyan-700 mb-6">
                            Jom Tambah Bersama! 🐢
                        </h2>

                        <!-- Grid Soalan -->
                        <div class="flex-1 grid grid-cols-2 gap-x-12 gap-y-5 content-start">
                `;

                // Jana 14 soalan untuk Aras Rendah
                for (let i = 0; i < 14; i++) {
                    let a = getRandomInt(1, 15);
                    let maxB = 20 - a;
                    let b = getRandomInt(1, maxB);
                    let icon = getRandomIcon();

                    pageHtml += `
                            <div class="flex items-center justify-between bg-cyan-50/50 border-2 border-cyan-300 rounded-2xl px-6 py-3 shadow-sm">
                                <span class="text-3xl font-bold w-8 text-center text-slate-700">${a}</span>
                                <span class="text-3xl font-bold text-cyan-600">+</span>
                                <span class="text-3xl font-bold w-8 text-center text-slate-700">${b}</span>
                                <span class="text-3xl font-bold text-cyan-600">=</span>
                                <div class="relative w-16 h-12 bg-white border-2 border-cyan-400 rounded-xl flex items-center justify-center shadow-inner">
                                    <span class="absolute opacity-20 text-3xl">${icon}</span>
                                </div>
                            </div>
                    `;
                }

                pageHtml += `
                        </div>
                    </div>
                </div>
                `;
                htmlContent += pageHtml;
            }

            // ==========================================
            // JANA 25 MUKA SURAT ARAS TINGGI (Bawah 100)
            // ==========================================
            for (let p = 0; p < 25; p++) {
                let pageNum = p + 16;
                
                let pageHtml = `
                <div class="print-page shadow-2xl p-4">
                    <!-- Hiasan Sempadan Solid -->
                    <div class="absolute inset-4 border-[8px] border-cyan-600 rounded-[2rem] pointer-events-none"></div>
                    <div class="absolute inset-7 border-[3px] border-cyan-300 rounded-[1.5rem] pointer-events-none"></div>
                    
                    <div class="w-full px-12 pt-10 pb-6 flex-1 flex flex-col justify-between z-10 box-border h-full">
                        <!-- Bahagian Header -->
                        <div class="flex justify-between items-start mb-2">
                            <div class="border-4 border-cyan-800 rounded-2xl p-3 bg-white shadow-md">
                                <h2 class="text-2xl font-black text-cyan-900 leading-tight">
                                    Cabaran Minda<br />Hasil Tambah
                                </h2>
                            </div>
                            <div class="flex gap-4 items-center">
                                <span class="text-5xl animate-bounce" style="animation-duration: 2s;">🐙</span>
                                <span class="text-5xl">🐬</span>
                                <span class="text-xl font-bold text-cyan-800 ml-4">${pageNum}</span>
                            </div>
                        </div>

                        <!-- Grid Soalan Bentuk Lazim -->
                        <div class="grid grid-cols-3 gap-x-8 gap-y-6 my-auto py-4">
                `;

                // Jana 12 soalan bentuk lazim
                for (let i = 0; i < 12; i++) {
                    let a = getRandomInt(10, 89);
                    let maxB = 99 - a;
                    let minB = maxB >= 10 ? 10 : 1;
                    let b = getRandomInt(minB, maxB);
                    let icon = getRandomIcon();

                    pageHtml += `
                            <div class="relative border-[3px] border-cyan-800 rounded-[1.5rem] p-5 bg-white shadow-sm flex flex-col items-end mx-auto w-[150px]">
                                <!-- Ikon terapung kecil -->
                                <div class="absolute -top-4 -right-4 text-2xl bg-cyan-50 rounded-full p-1 border-2 border-cyan-200">
                                    ${icon}
                                </div>

                                <div class="text-4xl leading-none font-bold text-slate-800 tracking-wider font-mono mr-2">
                                    ${a}
                                </div>
                                <div class="text-4xl leading-none font-bold text-slate-800 tracking-wider flex justify-between w-full font-mono mt-2 mb-2">
                                    <span>+</span>
                                    <span class="mr-2">${b}</span>
                                </div>
                                <!-- Garisan Jawapan -->
                                <div class="w-full border-t-[4px] border-slate-800 mt-2"></div>
                                <div class="w-full border-t-[4px] border-slate-800 mt-10 mb-1"></div>
                            </div>
                    `;
                }

                pageHtml += `
                        </div>

                        <!-- Bahagian Bawah (Nama) -->
                        <div class="flex justify-between items-end pt-2">
                            <div class="flex items-center text-lg font-bold text-cyan-900">
                                NAMA: <div class="ml-4 w-72 border-b-[3px] border-cyan-800"></div>
                            </div>
                            <div class="flex space-x-2 text-3xl">
                                🦀 🐠 🐢
                            </div>
                        </div>
                    </div>
                </div>
                `;
                
                htmlContent += pageHtml;
            }

            // Masukkan semua HTML yang dijana ke dalam container
            container.innerHTML = htmlContent;
        }

        // Jalankan fungsi penjanaan sebaik sahaja halaman dimuatkan
        window.onload = function() {
            // Berikan sedikit masa untuk menunjukkan animasi loading
            setTimeout(generateWorksheets, 100);
        };
    </script>
</body>
</html>
