<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembaran Kerja Bawah Laut - 50 Pages</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* SETUP KHUSUS UNTUK KERTAS A4 */
        :root {
            --a4-width: 210mm;
            --a4-height: 296mm; /* Kurang 1mm dari 297mm untuk elak extra page */
        }

        body {
            background-color: #f1f5f9;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Bekas utama setiap muka surat */
        .print-page {
            width: var(--a4-width);
            height: var(--a4-height);
            margin: 20px auto;
            background-color: white;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* TETAPAN KETIKA MENCETAK (PRINT MEDIA QUERY) */
        @page {
            size: A4;
            margin: 0mm; /* Kosongkan margin browser */
        }

        @media print {
            body {
                background-color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            #worksheet-container {
                margin: 0 !important;
                padding: 0 !important;
                background-color: transparent !important;
            }
            .print-page {
                margin: 0 !important;
                box-shadow: none !important;
                page-break-after: always; /* Paksa muka surat baharu */
                page-break-inside: avoid;
            }
            /* Buang border luaran jika browser pandai tambah border */
            html, body {
                width: var(--a4-width);
                height: 100%;
            }
        }
        
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        }
    </style>
</head>
<body>

    <!-- Panel Kawalan -->
    <div class="no-print sticky top-0 z-50 flex items-center justify-between bg-white px-6 py-4 shadow-md border-b-4 border-cyan-500">
        <div>
            <h1 class="text-xl font-bold text-cyan-700">🐠 Penjana Lembaran Kerja (50 Muka Surat)</h1>
            <p class="text-xs text-slate-500 mt-1">Tema: Bawah Laut</p>
        </div>
        <div class="flex space-x-3">
            <button onclick="generateWorksheets()" class="flex items-center rounded-lg bg-amber-400 px-4 py-2 text-sm font-bold text-amber-950 shadow-sm hover:bg-amber-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
                Jana Semula
            </button>
            <button onclick="window.print()" class="flex items-center rounded-lg bg-cyan-600 px-5 py-2 text-sm font-bold text-white shadow-sm hover:bg-cyan-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
                Cetak Semua
            </button>
        </div>
    </div>

    <!-- Container Utama -->
    <div id="worksheet-container" class="flex flex-col items-center bg-slate-200 w-full py-4">
        <div id="loading" class="text-xl font-bold text-cyan-600 my-20">Sila tunggu, menyusun 50 Muka Surat A4... 🐢</div>
    </div>

    <script>
        const SEA_ICONS = ['🐠', '🦀', '🐙', '🐢', '🐳', '🐬', '🐡', '🦑', '🐚'];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getRandomIcon() {
            return SEA_ICONS[getRandomInt(0, SEA_ICONS.length - 1)];
        }

        function getMathProblem(maxSum) {
            let a, b;
            if (maxSum === 10) {
                a = getRandomInt(1, 9);
                b = getRandomInt(1, 10 - a);
            } else if (maxSum === 15) {
                a = getRandomInt(1, 14);
                b = getRandomInt(1, 15 - a);
            } else if (maxSum === 20) {
                a = getRandomInt(2, 18);
                b = getRandomInt(1, 20 - a);
            } else if (maxSum === 99) {
                a = getRandomInt(10, 89);
                b = getRandomInt(5, 99 - a);
            } else if (maxSum === 200) {
                a = getRandomInt(30, 170);
                b = getRandomInt(15, 199 - a);
            }
            return { a, b, icon: getRandomIcon() };
        }

        function generateWorksheets() {
            const container = document.getElementById('worksheet-container');
            container.innerHTML = ''; 
            let htmlContent = '';

            for (let p = 1; p <= 50; p++) {
                
                let maxSum, levelTitle;
                if (p <= 5) {
                    maxSum = 10; levelTitle = "Bawah 10";
                } else if (p <= 10) {
                    maxSum = 15; levelTitle = "Bawah 15";
                } else if (p <= 15) {
                    maxSum = 20; levelTitle = "Bawah 20";
                } else if (p <= 30) {
                    maxSum = 99; levelTitle = "Bawah 100";
                } else {
                    maxSum = 200; levelTitle = "Bawah 200";
                }

                let pageHtml = `
                <div class="print-page p-6">
                    
                    <!-- Hiasan Sempadan -->
                    <div class="absolute inset-4 border-[4px] border-cyan-600 rounded-[1.5rem] pointer-events-none z-0"></div>
                    <div class="absolute inset-[1.25rem] border-[2px] border-dashed border-cyan-300 rounded-[1.2rem] pointer-events-none z-0"></div>
                    
                    <div class="w-full h-full flex flex-col z-10 px-4 py-2 relative">
                        
                        <!-- Bahagian Header -->
                        <div class="flex justify-between items-center mb-4">
                            <div class="border-[3px] border-cyan-800 rounded-xl px-4 py-2 bg-white shadow-sm">
                                <h2 class="text-xl font-black text-cyan-900 leading-tight">
                                    Misi Matematik 🐳<br />
                                    <span class="text-sm text-cyan-600">Tahap: Hasil Tambah ${levelTitle}</span>
                                </h2>
                            </div>
                            <div class="flex items-center">
                                <div class="text-right mr-3">
                                    <div class="font-bold text-cyan-900 text-sm mb-1 flex items-center justify-end">NAMA: <div class="ml-2 w-40 border-b-2 border-cyan-800"></div></div>
                                    <div class="font-bold text-cyan-900 text-sm flex items-center justify-end">TARIKH: <div class="ml-2 w-24 border-b-2 border-cyan-800"></div></div>
                                </div>
                                <span class="text-lg font-bold text-cyan-800 bg-cyan-100 w-10 h-10 flex items-center justify-center rounded-full border-2 border-cyan-300">${p}</span>
                            </div>
                        </div>

                        <!-- SEKSYEN A: MENDATAR -->
                        <div class="w-full mb-3">
                            <h3 class="font-bold text-cyan-700 text-lg mb-2 flex items-center">
                                <span class="mr-2">A. Selesaikan (Mendatar)</span> 🐡
                            </h3>
                            <div class="grid grid-cols-2 gap-x-8 gap-y-3">
                `;

                for (let i = 0; i < 6; i++) {
                    let prob = getMathProblem(maxSum);
                    pageHtml += `
                                <div class="flex items-center justify-between bg-cyan-50/70 border-2 border-cyan-300 rounded-xl px-4 py-2">
                                    <span class="text-2xl font-bold w-12 text-center text-slate-700 font-mono">${prob.a}</span>
                                    <span class="text-2xl font-bold text-cyan-600">+</span>
                                    <span class="text-2xl font-bold w-12 text-center text-slate-700 font-mono">${prob.b}</span>
                                    <span class="text-2xl font-bold text-cyan-600 mr-1">=</span>
                                    <div class="relative w-16 h-10 bg-white border-2 border-cyan-400 rounded-lg flex items-center justify-center">
                                        <span class="absolute opacity-20 text-2xl">${prob.icon}</span>
                                    </div>
                                </div>
                    `;
                }

                pageHtml += `
                            </div>
                        </div>

                        <!-- Garisan Pemisah -->
                        <div class="w-full border-t-2 border-dashed border-cyan-400 my-4"></div>

                        <!-- SEKSYEN B: BENTUK LAZIM -->
                        <div class="w-full flex-1 flex flex-col">
                            <h3 class="font-bold text-cyan-700 text-lg mb-4 flex items-center">
                                <span class="mr-2">B. Selesaikan (Bentuk Lazim)</span> 🐙
                            </h3>
                            <div class="grid grid-cols-3 gap-x-6 gap-y-4 my-auto px-2">
                `;

                for (let i = 0; i < 6; i++) {
                    let prob = getMathProblem(maxSum);
                    pageHtml += `
                                <div class="relative border-2 border-cyan-800 rounded-2xl p-4 bg-white shadow-sm flex flex-col items-end mx-auto w-[130px]">
                                    <div class="absolute -top-3 -right-3 text-xl bg-cyan-50 rounded-full p-1 border border-cyan-200">
                                        ${prob.icon}
                                    </div>
                                    <div class="text-3xl leading-none font-bold text-slate-800 tracking-widest font-mono mr-1">
                                        ${prob.a}
                                    </div>
                                    <div class="text-3xl leading-none font-bold text-slate-800 tracking-widest flex justify-between w-full font-mono mt-2 mb-1">
                                        <span>+</span>
                                        <span class="mr-1">${prob.b}</span>
                                    </div>
                                    <div class="w-full border-t-[3px] border-slate-800 mt-1"></div>
                                    <div class="w-full border-t-[3px] border-slate-800 mt-8 mb-1"></div>
                                </div>
                    `;
                }

                pageHtml += `
                            </div>
                        </div>

                        <!-- Hiasan Bawah -->
                        <div class="absolute bottom-1 left-2 text-3xl">🐚</div>
                        <div class="absolute bottom-1 right-2 text-3xl">🦀</div>
                        
                    </div>
                </div>
                `;
                
                htmlContent += pageHtml;
            }

            container.innerHTML = htmlContent;
        }

        window.onload = function() {
            setTimeout(generateWorksheets, 100);
        };
    </script>
</body>
</html>
